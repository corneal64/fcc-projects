<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="quote-card">
      <span class="quote-mark" aria-hidden="true">&ldquo;</span>

      <blockquote id="quote" class="quote-text">
        <span id="quote-loading" class="loading">Loading quote&hellip;</span>
      </blockquote>

      <cite id="author" class="quote-author"></cite>

      <div class="actions">
        <button id="new-quote" class="btn btn-primary" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          New Quote
        </button>

        <a
          id="tweet-link"
          class="btn btn-outline"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
          Tweet
        </a>
      </div>

      <footer class="credit">
        Coded by
        <a
          href="https://www.github.com/corneal64"
          target="_blank"
          rel="noopener noreferrer"
          >Cornelius</a
        >
      </footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
